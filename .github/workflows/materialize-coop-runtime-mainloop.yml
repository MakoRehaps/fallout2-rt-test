name: Materialize Co-op Runtime Main Loop Hook

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
    paths:
      - tools/patch_coop_runtime_mainloop_hook.py
      - .github/workflows/materialize-coop-runtime-mainloop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-debug-no-data-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch live gameplay loop
        run: python tools/patch_coop_runtime_mainloop_hook.py
      - name: Commit materialized source changes
        shell: bash
        run: |
          if git diff --quiet -- src/main.cc; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cc
          git commit -m "Drive co-op runtime from live gameplay loop"
          git push origin HEAD:fix/no-debug-no-data-copy
