name: Co-op Windows Build

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 / MSVC Debug
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PhoBoi, co-op, quest, lineage, and wilderness fixes
        shell: pwsh
        run: |
          python tools/patch_phoboi_remote_play.py
          python tools/patch_phoboi_labels.py
          python tools/patch_phoboi_session_token.py
          python tools/patch_phoboi_pagehide_release.py
          python tools/patch_phoboi_websocket_headers.py
          python tools/patch_phoboi_mobile_reliability.py
          python tools/patch_phoboi_video_layout_v4.py
          python tools/patch_phoboi_gamefirst_overlay_v5.py
          python tools/patch_coop_18_archetypes.py
          python tools/patch_coop_18_kits_repair.py
          python tools/patch_coop_simulation_pause.py
          python tools/patch_coop_downed_medical.py
          python tools/patch_coop_nearest_clinic.py
          python tools/patch_coop_final_hotbinds.py
          python tools/patch_coop_hud_and_leash.py
          python tools/patch_coop_full_repair_v2.py
          python tools/patch_coop_melee_hit_unlock.py
          python tools/patch_quest_profile_isolation.py
          python tools/patch_postgame_campaign_resume.py
          python tools/patch_f1_f2_lineage_transition.py
          python tools/patch_no_mountain_maps.py
          python tools/patch_wilderness_four_side_pool.py
          python tools/patch_zoom_scroll_bounds.py

          # Do not ship a partial co-op build again. These markers are the
          # user-visible systems that must exist in the materialized source.
          $required = @(
            @{ File = 'src/local_coop.h'; Marker = 'COOP_18_ARCHETYPES_V1' },
            @{ File = 'src/local_coop.h'; Marker = 'COOP_18_ARCHETYPES_MENU_V1' },
            @{ File = 'src/local_coop.h'; Marker = 'COOP_18_KITS_REPAIR_V1' },
            @{ File = 'src/local_coop.h'; Marker = 'COOP_WIDE_LEASH_V1' },
            @{ File = 'src/local_coop_runtime.h'; Marker = 'COOP_FINAL_HOTBINDS_V1' },
            @{ File = 'src/local_coop_runtime.h'; Marker = 'COOP_FOUR_PLAYER_HUD_V1' },
            @{ File = 'src/combat.cc'; Marker = 'COOP_MELEE_HIT_UNLOCK_V1' },
            @{ File = 'src/tile.cc'; Marker = 'COOP_VIEWPORT_SCROLL_BOUNDS_V1' }
          )
          foreach ($check in $required) {
            if (-not (Select-String -Path $check.File -Pattern $check.Marker -Quiet)) {
              throw "Required co-op patch missing: $($check.Marker) in $($check.File)"
            }
          }

          git diff --quiet -- src/local_coop_mobile.cc src/local_coop.h src/local_coop_runtime.h src/combat.cc src/critter.cc src/map.cc src/tile.cc src/worldmap.cc src/worldmap.h src/scripts.cc src/loadsave.cc src/loadsave.h src/unified_campaign_transition.h src/unified_campaign_carryover.h src/unified_world_system.h src/unified_fallout1_endgame_profile.h src/mainmenu.h src/main.cc
          $sourceChanged = $LASTEXITCODE -ne 0

          if (-not $sourceChanged) {
            Write-Host "PhoBoi/co-op/quest/lineage/wilderness source already current."
          } elseif ("${{ github.event_name }}" -eq "push") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/local_coop_mobile.cc src/local_coop.h src/local_coop_runtime.h src/combat.cc src/critter.cc src/map.cc src/tile.cc src/worldmap.cc src/worldmap.h src/scripts.cc src/loadsave.cc src/loadsave.h src/unified_campaign_transition.h src/unified_campaign_carryover.h src/unified_world_system.h src/unified_fallout1_endgame_profile.h src/mainmenu.h src/main.cc
            git commit -m "Apply complete co-op HUD, controls, kits, world and leash fixes"
            git push origin HEAD:fix/no-debug-no-data-copy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Applied complete co-op patches to this build workspace."
          }

          exit 0

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 4

      - name: Upload debug executable and symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-coop-windows-x64-debug
          path: |
            build/Debug/fallout2-ce.exe
            build/Debug/fallout2-ce.pdb
          retention-days: 7

      - name: Install Inno Setup
        if: success()
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Download verified Cloudflare tunnel helper
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $url -OutFile 'cloudflared.exe'
          if (-not (Test-Path 'cloudflared.exe')) { throw 'cloudflared download failed' }

      - name: Build full debug beta installer
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc /DBuildConfig=Debug installer\fallout-unified-coop-beta.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload full debug beta installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-Unified-Coop-Beta-Debug-Setup
          path: installer/output/Fallout-Unified-Coop-Beta-Debug-Setup.exe
          retention-days: 7
