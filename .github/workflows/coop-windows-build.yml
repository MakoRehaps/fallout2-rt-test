name: Co-op Windows Build

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / MSVC Debug
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PhoBoi, co-op, and wilderness fixes
        shell: pwsh
        run: |
          python tools/patch_phoboi_remote_play.py
          python tools/patch_phoboi_labels.py
          python tools/patch_phoboi_session_token.py
          python tools/patch_phoboi_pagehide_release.py
          python tools/patch_phoboi_websocket_headers.py
          python tools/patch_coop_simulation_pause.py
          python tools/patch_coop_downed_medical.py
          python tools/patch_no_mountain_maps.py

          git diff --quiet -- src/local_coop_mobile.cc src/local_coop.h src/local_coop_runtime.h src/combat.cc src/critter.cc src/map.cc
          $sourceChanged = $LASTEXITCODE -ne 0

          if (-not $sourceChanged) {
            Write-Host "PhoBoi/co-op/wilderness source already current."
          } elseif ("${{ github.event_name }}" -eq "push") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/local_coop_mobile.cc src/local_coop.h src/local_coop_runtime.h src/combat.cc src/critter.cc src/map.cc
            git commit -m "Apply PhoBoi, co-op medical, and wilderness fixes"
            git push origin HEAD:fix/no-debug-no-data-copy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Applied PhoBoi/co-op/wilderness patches to this build workspace."
          }

          # git diff --quiet deliberately returns 1 when patches changed files.
          # Do not let that expected status fail the workflow step.
          exit 0

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Debug
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 4

      - name: Upload debug executable and symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-coop-windows-x64-debug
          path: |
            build/Debug/fallout2-ce.exe
            build/Debug/fallout2-ce.pdb
          retention-days: 7

      - name: Install Inno Setup
        if: success()
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Download verified Cloudflare tunnel helper
        if: success()
        shell: pwsh
        run: |
          $version = "2026.8.2"
          $expected = "c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5"
          $base = "https://github.com/cloudflare/cloudflared"
          Invoke-WebRequest "$base/releases/download/$version/cloudflared-windows-amd64.exe" -OutFile "installer/cloudflared.exe"
          Invoke-WebRequest "$base/raw/refs/tags/$version/LICENSE" -OutFile "installer/cloudflared-LICENSE.txt"
          $actual = (Get-FileHash "installer/cloudflared.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "cloudflared SHA256 mismatch: expected $expected, got $actual"
          }

      - name: Build full debug beta installer
        if: success()
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\UnifiedCoopBeta.iss"

      - name: Upload full debug beta installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-Unified-Coop-Beta-Debug-Setup
          path: installer-output/Fallout-Unified-Coop-Beta-Debug-Setup.exe
          retention-days: 7
