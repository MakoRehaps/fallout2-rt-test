name: Co-op Windows Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 / MSVC
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config RelWithDebInfo --parallel 4

      - name: Upload executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-coop-windows-x64
          path: build/RelWithDebInfo/fallout2-ce.exe
          retention-days: 7

      - name: Install Inno Setup
        if: success()
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build beta installer
        if: success()
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\UnifiedCoopBeta.iss"

      - name: Upload beta installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-Unified-Coop-Beta-Setup
          path: installer-output/Fallout-Unified-Coop-Beta-Setup.exe
          retention-days: 7
