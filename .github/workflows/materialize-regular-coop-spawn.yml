name: Materialize Regular Co-op Spawn Handoff

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
    paths:
      - tools/patch_regular_coop_spawn_handoff.py
      - .github/workflows/materialize-regular-coop-spawn.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-debug-no-data-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply regular co-op spawn handoff patch
        run: python tools/patch_regular_coop_spawn_handoff.py
      - name: Commit materialized source
        shell: bash
        run: |
          if git diff --quiet -- src/local_coop.h src/local_coop_group_room.h src/local_coop_runtime.h; then
            echo "Already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_coop.h src/local_coop_group_room.h src/local_coop_runtime.h
          git commit -m "Fix regular co-op ready-room player spawn"
          git push origin HEAD:fix/no-debug-no-data-copy
