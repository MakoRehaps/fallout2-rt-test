name: PhoBoi Hybrid Controller Windows Build

on:
  push:
    branches:
      - feat/phoboi-browser-gamepad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 / Hybrid Controller Slot Handoff
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build committed feature sources directly. The legacy patch scripts
      # expect an unsplit HTML raw string and must NOT rewrite this branch.

      - name: Verify hybrid controller source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mobile = Get-Content src/local_coop_mobile.cc -Raw
          $inputSource = Get-Content src/local_coop.h -Raw
          $browser = Get-Content src/local_coop_browser_gamepad.h -Raw
          foreach ($symbol in @(
            'PHOBOI_BROWSER_STANDARD_GAMEPAD_V1',
            'navigator.getGamepads',
            "mapping === 'standard'"
          )) {
            if (-not $browser.Contains($symbol)) { throw "Browser gamepad missing: $symbol" }
          }
          foreach ($symbol in @(
            'localCoopBrowserGamepadScript',
            'route == "/gamepad.js"',
            'route == "/release"',
            'nativePad ? nativePad.axes : axes',
            'PHOBOI_CLOUDFLARE_ROUTE_V5',
            'SLOT RELEASED'
          )) {
            if (-not $mobile.Contains($symbol)) { throw "PhoBoi hybrid missing: $symbol" }
          }
          foreach ($symbol in @(
            'COOP_INPUT_SLOT_HANDOFF_V1',
            'SDL_JoystickGetSerial',
            'SDL_GameControllerClose(controller)'
          )) {
            if (-not $inputSource.Contains($symbol)) { throw "Slot handoff missing: $symbol" }
          }
          Write-Host 'PhoBoi + four player slot handoff invariants PASS'

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug --parallel 4

      - name: Upload debug executable and symbols
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-controller-coop-windows-x64-debug
          path: |
            build/Debug/fallout2-ce.exe
            build/Debug/fallout2-ce.pdb
          retention-days: 7

      - name: Install Inno Setup
        if: success()
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download verified Cloudflare tunnel helper
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile 'installer\cloudflared.exe'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/cloudflare/cloudflared/master/LICENSE' -OutFile 'installer\cloudflared-LICENSE.txt'
          if (-not (Test-Path 'installer\cloudflared.exe')) { throw 'cloudflared download failed' }
          if (-not (Test-Path 'installer\cloudflared-LICENSE.txt')) { throw 'cloudflared license download failed' }

      - name: Prepare Freedoom 0.13.0 packaged assets
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'freedoom-0.13.0.zip'
          Invoke-WebRequest -Uri 'https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '3f9b264f3e3ce503b4fb7f6bdcb1f419d93c7b546f4df3e874dd878db9688f59') {
            throw "Freedoom archive checksum mismatch: $hash"
          }
          Expand-Archive -Path $zip -DestinationPath freedoom-stage -Force
          New-Item -ItemType Directory -Force -Path 'installer\freedoom' | Out-Null
          Copy-Item 'freedoom-stage\freedoom-0.13.0\freedoom1.wad' 'installer\freedoom\freedoom1.wad' -Force
          Copy-Item 'freedoom-stage\freedoom-0.13.0\COPYING.txt' 'installer\freedoom\COPYING.txt' -Force

      - name: Build full controller co-op debug installer
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          & $iscc installer\UnifiedCoopBeta.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'installer-output\Fallout-Unified-Coop-Beta-Debug-Setup.exe')) {
            throw 'installer output was not produced'
          }

      - name: Upload controller co-op debug installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-Unified-Coop-Controller-Beta-Debug-Setup
          path: installer-output/Fallout-Unified-Coop-Beta-Debug-Setup.exe
          retention-days: 7
