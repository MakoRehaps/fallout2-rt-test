name: Materialize Uniform Ready Room

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
    paths:
      - tools/patch_uniform_ready_room.py
      - .github/workflows/materialize-uniform-ready-room.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-debug-no-data-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply uniform ready-room patch
        run: python tools/patch_uniform_ready_room.py
      - name: Commit materialized source
        shell: bash
        run: |
          if git diff --quiet -- src/local_coop_group_room.h; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_coop_group_room.h
          git commit -m "Make ready room uniform for all players"
          git push origin HEAD:fix/no-debug-no-data-copy
