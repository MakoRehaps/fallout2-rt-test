name: Materialize Midgame Ready Room and Viewport GUI

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
    paths:
      - tools/patch_midgame_ready_room_and_viewport_gui.py
      - .github/workflows/materialize-midgame-ready-room-gui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-debug-no-data-copy
          fetch-depth: 0

      - name: Apply midgame ready room and viewport GUI patch
        run: python3 tools/patch_midgame_ready_room_and_viewport_gui.py

      - name: Verify materialized source
        run: |
          grep -q 'COOP_MIDGAME_READY_ROOM_V1' src/local_coop.h
          grep -q 'COOP_MIDGAME_READY_ROOM_UI_V1' src/local_coop_group_room.h
          grep -q 'COOP_MIDGAME_READY_ROOM_RUNTIME_V1' src/local_coop_runtime.h
          grep -q 'COOP_VIEWPORT_SCALED_PERSONAL_UI_V1' src/local_coop_personal_ui.h
          grep -q 'COOP_STABLE_SPLIT_WITH_PERSONAL_UI_V1' src/local_coop_iso_cameras.h
          grep -q 'COOP_MIDGAME_PHONE_READY_ROOM_V1' src/local_coop_mobile.cc

      - name: Commit materialized source
        run: |
          if git diff --quiet -- src/local_coop.h src/local_coop_group_room.h src/local_coop_runtime.h src/local_coop_personal_ui.h src/local_coop_iso_cameras.h src/local_coop_mobile.cc; then
            echo 'Source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/local_coop.h src/local_coop_group_room.h src/local_coop_runtime.h src/local_coop_personal_ui.h src/local_coop_iso_cameras.h src/local_coop_mobile.cc
          git commit -m 'Add Baldurs Gate style midgame party room and viewport GUI'
          git push origin HEAD:fix/no-debug-no-data-copy
