name: Materialize Regular Co-op Build Compat

on:
  push:
    branches:
      - fix/no-debug-no-data-copy
    paths:
      - tools/patch_regular_coop_fps_compat_marker.py
      - .github/workflows/materialize-regular-coop-build-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-debug-no-data-copy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add build-validator compatibility marker
        run: python tools/patch_regular_coop_fps_compat_marker.py
      - name: Commit materialized source
        shell: bash
        run: |
          if git diff --quiet -- src/local_coop_runtime.h; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/local_coop_runtime.h
          git commit -m "Restore regular co-op build validator compatibility"
          git push origin HEAD:fix/no-debug-no-data-copy
